services:
  lyric-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lyric-streamer
    restart: unless-stopped
    networks:
      - broker
    env_file:
      - .env
    volumes:
      - ./data:/data

networks:
  broker:
    external: true
    name: ${MQTT_NETWORK:-mqtt-net}
